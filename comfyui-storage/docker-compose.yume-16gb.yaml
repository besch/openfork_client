version: "3.8"

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.yume-16gb
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLI_ARGS=--listen 0.0.0.0 --port 8188 --preview-method auto
    volumes:
      - ./storage:/opt/ComfyUI/output
      - ./storage:/opt/ComfyUI/input
      - ./storage:/opt/ComfyUI/user
      - ./storage/models:/opt/models
    ports:
      - "8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
