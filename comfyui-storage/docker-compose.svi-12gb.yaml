services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.svi-12gb
    container_name: openfork-svi-12gb
    ports:
      - "8188:8188"
    volumes:
      - ./storage/ComfyUI/models:/opt/ComfyUI/models
      - ./storage/ComfyUI/output:/opt/ComfyUI/output
      - ./storage/ComfyUI/input:/opt/ComfyUI/input
      - ./storage/ComfyUI/user:/opt/ComfyUI/user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
