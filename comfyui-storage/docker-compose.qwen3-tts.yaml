services:
  qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile.qwen3-tts
    container_name: qwen3-tts
    ports:
      - "8000:8000"
    volumes:
      - ./storage/qwen3-tts/output:/app/output
      - ./storage/qwen3-tts/input:/app/input
      - ./storage/qwen3-tts/models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
