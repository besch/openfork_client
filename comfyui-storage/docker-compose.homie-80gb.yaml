services:
  homie-80gb:
    build:
      context: .
      dockerfile: Dockerfile.homie-80gb
      secrets:
        - hf_token
    container_name: homie-80gb
    ports:
      - "8000:8000"
    volumes:
      - ./storage/homie/input:/app/input
      - ./storage/homie/output:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

secrets:
  hf_token:
    environment: HF_TOKEN
