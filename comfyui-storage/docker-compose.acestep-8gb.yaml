services:
  acestep-8gb:
    build:
      context: .
      dockerfile: Dockerfile.acestep-8gb
    container_name: acestep-8gb
    ports:
      - "8000:8000"
    volumes:
      - ./storage/acestep-8gb/output:/app/output
      - ./storage/acestep-8gb/pretrained:/app/pretrained
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HOME=/app/pretrained
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
