services:
  comfyui-vibevoice:
    build:
      context: .
      dockerfile: Dockerfile.vibevoice
    container_name: comfyui-vibevoice-cu128
    ports:
      - "8188:8188"
    volumes:
      - ./storage/ComfyUI/output:/opt/ComfyUI/output
      - ./storage/ComfyUI/input:/opt/ComfyUI/input
      - ./storage/ComfyUI/user:/opt/ComfyUI/user
      - ./storage/ComfyUI/models/vibevoice:/opt/ComfyUI/models/vibevoice
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
