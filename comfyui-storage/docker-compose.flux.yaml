services:
  comfyui-flux:
    build:
      context: .
      dockerfile: Dockerfile.flux
    container_name: comfyui-flux-cu128
    ports:
      - "8188:8188"
    volumes:
      - ./storage/ComfyUI/output:/opt/ComfyUI/output
      - ./storage/ComfyUI/input:/opt/ComfyUI/input
      - ./storage/ComfyUI/user:/opt/ComfyUI/user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true
