services:
  diagdistill:
    build:
      context: .
      dockerfile: Dockerfile.hunyuan-video-diagdistill
    container_name: openfork-diagdistill
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./storage/ComfyUI/models/huggingface:/root/.cache/huggingface
      - ./storage/diagdistill/models:/opt/DiagDistill/models
    environment:
      - CUDA_VISIBLE_DEVICES=0
    restart: unless-stopped
